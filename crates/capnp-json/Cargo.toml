[package]
name = "capnp-json-newtype"
description = "Cap'n Proto JSON codec for capnp-newtype"
documentation = "https://docs.rs/capnp-json-newtype"
readme = "README.md"
keywords = ["capnp", "capnproto", "json", "codec", "serialization"]
categories = ["encoding", "network-programming"]
include = [
  "src/**/*.rs",
  "build.rs",
  "json.capnp",
  "rust-json.capnp",
  "README.md",
  "LICENSE",
]

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.release]
# Keep the install snippet in the README pinned to the released version.
pre-release-replacements = [
  { file = "README.md", search = 'capnp-json = "[^"]+"', replace = 'capnp-json = "{{version}}"', exactly = 1 },
]

[lib]
name = "capnp_json"

[dependencies]
capnp.workspace = true

[build-dependencies]
capnpc.workspace = true
