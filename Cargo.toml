[workspace]
resolver = "2"
members = [
  "crates/capnp-json",
  "crates/capnp-json-test",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.81.0"
license = "MIT"
authors = ["Ben Jackson <puremourning@gmail.com>"]
repository = "https://github.com/puremourning/capnp-json"

[workspace.dependencies]
capnp = { package = "capnp-newtype", version = "0.28" }
capnpc = { package = "capnpc-newtype", version = "0.28" }
capnp-json = { package = "capnp-json-newtype", path = "crates/capnp-json" }

[workspace.metadata.release]
# One shared version and a single `newtype-vX.Y.Z` tag for the whole
# workspace. The prefix keeps the newtype branch's tags apart from main's.
shared-version = true
tag-name = "newtype-v{{version}}"
allow-branch = ["newtype"]
pre-release-commit-message = "Release newtype v{{version}}"
# `capnp-json-test` has `publish = false`, so cargo-release skips it.
