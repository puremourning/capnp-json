[workspace]
resolver = "2"
members = [
  "crates/capnp-json",
  "crates/capnp-json-test",
]

[workspace.package]
version = "0.3.2"
edition = "2021"
rust-version = "1.81.0"
license = "MIT"
authors = ["Ben Jackson <puremourning@gmail.com>"]
repository = "https://github.com/puremourning/capnp-json"

[workspace.dependencies]
capnp = { package = "capnp-newtype", version = "0.27" }
capnpc = { package = "capnpc-newtype", version = "0.27" }
capnp-json = { package = "capnp-json-newtype", path = "crates/capnp-json" }

[workspace.metadata.release]
# One shared version and a single `vX.Y.Z` tag for the whole workspace.
shared-version = true
tag-name = "v{{version}}"
allow-branch = ["main"]
pre-release-commit-message = "Release v{{version}}"
# `capnp-json-test` has `publish = false`, so cargo-release skips it.
