name: CI

on:
  push:
    branches: [main, newtype]
  pull_request:
    branches: [main, newtype]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly, "1.81.0"]
    steps:
      - uses: actions/checkout@v5
      # This branch needs the newtype fork's capnp, not a distro one.
      - uses: puremourning/rust-ci/setup-capnproto@v1
        with:
          repository: https://github.com/puremourning/capnproto
          release: newtype-latest
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check --unstable-features --error-on-unformatted

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # This branch needs the newtype fork's capnp, not a distro one.
      - uses: puremourning/rust-ci/setup-capnproto@v1
        with:
          repository: https://github.com/puremourning/capnproto
          release: newtype-latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -Dwarnings

  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # This branch needs the newtype fork's capnp, not a distro one.
      - uses: puremourning/rust-ci/setup-capnproto@v1
        with:
          repository: https://github.com/puremourning/capnproto
          release: newtype-latest
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Setup miri
        run: cargo miri setup
      - name: Run miri
        run: cargo miri test --workspace
