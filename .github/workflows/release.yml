name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release: an explicit SemVer (e.g. 0.2.0, no v prefix) or a bump level (patch, minor, major).'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Cap'n Proto
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y capnproto libcapnp-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-release

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Test
        run: cargo test --workspace

      # cargo-release bumps the workspace version, updates the README pin,
      # commits, tags `vX.Y.Z`, pushes, and publishes to crates.io. Branch
      # and version validation are handled by its `[workspace.metadata.release]`
      # config (see the root Cargo.toml).
      - name: cargo release
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo release "${{ inputs.version }}" --workspace --no-confirm --execute

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "capnp-json") | .version')
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes
